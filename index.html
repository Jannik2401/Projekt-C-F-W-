<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007aff">
<title>Klassenbuch</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f2f7;
    color: #1c1c1e;
}

header {
    background: #007aff;
    color: white;
    padding: 22px 20px;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 5px 0 0;
    opacity: .9;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

h2 {
    margin-top: 0;
}

input,
select,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d1d6;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 10px;
    background: white;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px 17px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px;
    background: #007aff;
    color: white;
}

button:hover {
    opacity: .85;
}

button.danger {
    background: #ff3b30;
}

button.warning {
    background: #ff9500;
}

button.secondary {
    background: #8e8e93;
}

button.success {
    background: #34c759;
}

.settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
}

.user-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.user {
    position: relative;
    overflow: hidden;
    border: 1px solid #e5e5ea;
    border-radius: 15px;
    min-height: 120px;
    touch-action: pan-y;
    user-select: none;
    background: white;
}

.user-content {
    position: relative;
    z-index: 2;
    min-height: 120px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    background: white;
    transition: transform .25s ease;
}

.user-info strong {
    display: block;
    font-size: 17px;
}

.user-info span {
    color: #666;
    font-size: 14px;
}

.user-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.swipe-action {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 700;
    font-size: 14px;
    text-align: center;
    line-height: 1.2;
}

.swipe-action.left {
    left: 0;
    background: #ff3b30;
}

.swipe-action.right {
    right: 0;
    background: #ff9500;
}

.swipe-hint {
    margin: 0 0 15px;
    padding: 12px;
    border-radius: 12px;
    background: #eef6ff;
    color: #24527a;
    font-size: 14px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 5px;
}

.badge.ok {
    background: #dff7e5;
    color: #16833a;
}

.badge.late {
    background: #fff0d6;
    color: #b35c00;
}

.badge.absent {
    background: #ffe0df;
    color: #b42318;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
}

.stat {
    background: #f2f2f7;
    border-radius: 15px;
    padding: 18px;
}

.stat strong {
    display: block;
    font-size: 28px;
}

.entry {
    border-left: 4px solid #007aff;
    padding: 12px;
    background: #f7f7f8;
    border-radius: 8px;
    margin-bottom: 10px;
}

.entry small {
    color: #666;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media (max-width: 650px) {
    .user-content {
        flex-direction: column;
        align-items: flex-start;
    }

    .user-actions {
        justify-content: flex-start;
    }

    button {
        margin-left: 0;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Klassenbuch</h1>
    <p>Nutzer, Anwesenheit und Einträge verwalten</p>
</header>

<div class="container">

<section class="card">
    <h2>⚙️ Einstellungen</h2>

    <div class="settings-grid">
        <div>
            <label>
                <strong>Ab wann gilt man als zu spät?</strong>
            </label>
            <input type="time" id="lateTime" value="08:00">
        </div>

        <div>
            <label>
                <strong>Klassenname</strong>
            </label>
            <input type="text" id="className" placeholder="z. B. 10A">
        </div>
    </div>

    <button onclick="saveSettings()" class="success">
        Einstellungen speichern
    </button>
</section>

<section class="card">
    <h2>👤 Nutzer hinzufügen</h2>

    <input
        type="text"
        id="userName"
        placeholder="Vor- und Nachname"
    >

    <input
        type="text"
        id="userNumber"
        placeholder="Schülernummer (optional)"
    >

    <button onclick="addUser()">
        Nutzer hinzufügen
    </button>

    <button onclick="generateRandomUsers()" class="warning">
        🎲 10 zufällige Nutzer erstellen
    </button>

    <button onclick="deleteAllUsers()" class="danger">
        🗑️ Alle Nutzer löschen
    </button>
</section>

<section class="card">
    <h2>📊 Übersicht</h2>

    <div class="stats">
        <div class="stat">
            <strong id="userCount">0</strong>
            Nutzer
        </div>

        <div class="stat">
            <strong id="entryCount">0</strong>
            Klassenbuch-Einträge
        </div>

        <div class="stat">
            <strong id="lateCount">0</strong>
            Verspätungen
        </div>

        <div class="stat">
            <strong id="absentCount">0</strong>
            Fehlzeiten
        </div>
    </div>
</section>

<section class="card">
    <h2>👥 Nutzerliste</h2>

    <p class="swipe-hint">
        👉 Nach rechts wischen = zu spät ·
        👈 Nach links wischen = fehlt
    </p>

    <input
        type="search"
        id="searchUser"
        placeholder="🔎 Nutzer suchen..."
        oninput="renderUsers()"
    >

    <div id="userList" class="user-list"></div>
</section>

<section class="card">
    <h2>📝 Klassenbuch-Eintrag</h2>

    <select id="entryUser">
        <option value="">Nutzer auswählen</option>
    </select>

    <select id="entryType">
        <option value="Anwesend">Anwesend</option>
        <option value="Zu spät">Zu spät</option>
        <option value="Abwesend">Abwesend</option>
        <option value="Entschuldigt">Entschuldigt</option>
    </select>

    <input type="date" id="entryDate">

    <textarea
        id="entryNote"
        placeholder="Notiz / Bemerkung..."
    ></textarea>

    <button onclick="addEntry()">
        Eintrag hinzufügen
    </button>
</section>

<section class="card">
    <h2>📖 Klassenbuch</h2>

    <div id="entries"></div>
</section>

</div>

<script>

let users =
    JSON.parse(localStorage.getItem("klassenbuch_users")) || [];

let entries =
    JSON.parse(localStorage.getItem("klassenbuch_entries")) || [];

let settings =
    JSON.parse(localStorage.getItem("klassenbuch_settings")) || {
        lateTime: "08:00",
        className: ""
    };

let swipeStartX = 0;
let swipeStartY = 0;
let swipeCurrentX = 0;
let activeSwipeElement = null;
let swipeMoved = false;

function saveData() {
    localStorage.setItem(
        "klassenbuch_users",
        JSON.stringify(users)
    );

    localStorage.setItem(
        "klassenbuch_entries",
        JSON.stringify(entries)
    );

    localStorage.setItem(
        "klassenbuch_settings",
        JSON.stringify(settings)
    );
}

function loadSettings() {
    document.getElementById("lateTime").value =
        settings.lateTime || "08:00";

    document.getElementById("className").value =
        settings.className || "";

    updateHeader();
}

function saveSettings() {
    settings.lateTime =
        document.getElementById("lateTime").value;

    settings.className =
        document.getElementById("className").value.trim();

    saveData();
    updateHeader();

    alert("Einstellungen gespeichert.");
}

function updateHeader() {
    const subtitle =
        document.querySelector("header p");

    if (settings.className) {
        subtitle.textContent =
            "Klasse " +
            settings.className +
            " · Nutzer, Anwesenheit und Einträge verwalten";
    } else {
        subtitle.textContent =
            "Nutzer, Anwesenheit und Einträge verwalten";
    }
}

function addUser() {
    const name =
        document.getElementById("userName")
        .value
        .trim();

    const number =
        document.getElementById("userNumber")
        .value
        .trim();

    if (!name) {
        alert("Bitte einen Namen eingeben.");
        return;
    }

    users.push({
        id: Date.now() + Math.random(),
        name: name,
        number: number,
        created: new Date().toISOString()
    });

    document.getElementById("userName").value = "";
    document.getElementById("userNumber").value = "";

    saveData();
    renderAll();
}

function generateRandomUsers() {
    const names = [
        "Max Mustermann",
        "Anna Müller",
        "Leon Schneider",
        "Sophie Fischer",
        "Paul Weber",
        "Emma Wagner",
        "Ben Becker",
        "Mia Schulz",
        "Finn Hoffmann",
        "Lina Schäfer",
        "Noah Koch",
        "Lena Bauer",
        "Elias Richter",
        "Laura Klein",
        "Jonas Wolf",
        "Marie Schröder",
        "Felix Neumann",
        "Clara Schwarz",
        "Tim Zimmermann",
        "Nele Braun",
        "Lukas Krüger",
        "Emily Hartmann",
        "Jan Lange",
        "Sarah Werner",
        "David Schmitz"
    ];

    const availableNames = names.filter(name =>
        !users.some(user =>
            user.name === name
        )
    );

    if (availableNames.length < 10) {
        for (let i = 0; i < 10; i++) {
            users.push({
                id: Date.now() + Math.random(),
                name: "Testnutzer " + (users.length + 1),
                number: "",
                created: new Date().toISOString()
            });
        }
    } else {
        availableNames
            .sort(() => Math.random() - 0.5)
            .slice(0, 10)
            .forEach((name, index) => {
                users.push({
                    id: Date.now() + Math.random(),
                    name: name,
                    number: String(
                        users.length +
                        index +
                        1
                    ),
                    created: new Date().toISOString()
                });
            });
    }

    saveData();
    renderAll();

    alert(
        "10 zufällige Nutzer wurden erstellt."
    );
}

function deleteAllUsers() {
    if (users.length === 0) {
        alert("Es sind keine Nutzer vorhanden.");
        return;
    }

    const confirmation =
        confirm(
            "⚠️ Wirklich ALLE Nutzer löschen?\n\n" +
            "Diese Aktion kann nicht rückgängig gemacht werden."
        );

    if (!confirmation) return;

    const deleteEntries =
        confirm(
            "Sollen auch alle Klassenbuch-Einträge gelöscht werden?"
        );

    users = [];

    if (deleteEntries) {
        entries = [];
    }

    saveData();
    renderAll();

    alert("Alle Nutzer wurden gelöscht.");
}

function deleteUser(id) {
    const user =
        users.find(u => u.id === id);

    if (!user) return;

    if (!confirm(
        'Soll "' +
        user.name +
        '" wirklich gelöscht werden?'
    )) {
        return;
    }

    users =
        users.filter(
            u => u.id !== id
        );

    saveData();
    renderAll();
}

function editUser(id) {
    const user =
        users.find(u => u.id === id);

    if (!user) return;

    const newName =
        prompt(
            "Neuer Name:",
            user.name
        );

    if (newName === null) return;

    const name =
        newName.trim();

    if (!name) {
        alert("Der Name darf nicht leer sein.");
        return;
    }

    const newNumber =
        prompt(
            "Schülernummer:",
            user.number || ""
        );

    if (newNumber === null) return;

    user.name = name;
    user.number = newNumber.trim();

    saveData();
    renderAll();
}

function renderUsers() {
    const list =
        document.getElementById("userList");

    const search =
        document.getElementById("searchUser")
        .value
        .toLowerCase()
        .trim();

    const filteredUsers =
        users.filter(user =>
            user.name
                .toLowerCase()
                .includes(search)
            ||
            (user.number || "")
                .toLowerCase()
                .includes(search)
        );

    list.innerHTML = "";

    if (filteredUsers.length === 0) {
        list.innerHTML =
            '<div class="empty">Keine Nutzer gefunden.</div>';

        updateEntryUserSelect();
        return;
    }

    filteredUsers.forEach(user => {
        const userEntries =
            entries.filter(entry =>
                entry.userId === user.id
            );

        const late =
            userEntries.filter(e =>
                e.type === "Zu spät"
            ).length;

        const absent =
            userEntries.filter(e =>
                e.type === "Abwesend"
            ).length;

        const div =
            document.createElement("div");

        div.className = "user";

        div.innerHTML = `
            <div class="swipe-action left">
                ←<br>Fehlt
            </div>

            <div class="swipe-action right">
                →<br>Zu spät
            </div>

            <div class="user-content">
                <div class="user-info">
                    <strong>${escapeHtml(user.name)}</strong>

                    <span>
                        ${
                            user.number
                            ? "Schülernummer: " +
                              escapeHtml(user.number)
                            : "Keine Schülernummer"
                        }
                    </span>

                    <br>

                    ${
                        late > 0
                        ? `<span class="badge late">
                            ${late}× zu spät
                           </span>`
                        : ""
                    }

                    ${
                        absent > 0
                        ? `<span class="badge absent">
                            ${absent}× abwesend
                           </span>`
                        : ""
                    }

                    ${
                        late === 0 &&
                        absent === 0
                        ? `<span class="badge ok">
                            Keine Auffälligkeiten
                           </span>`
                        : ""
                    }
                </div>

                <div class="user-actions">
                    <button
                        onclick="showUserEntries(${user.id})"
                        class="secondary">
                        📖 Einträge
                    </button>

                    <button
                        onclick="editUser(${user.id})">
                        ✏️ Bearbeiten
                    </button>

                    <button
                        onclick="deleteUser(${user.id})"
                        class="danger">
                        🗑️ Löschen
                    </button>
                </div>
            </div>
        `;

        const content =
            div.querySelector(".user-content");

        addSwipeEvents(
            div,
            content,
            user.id
        );

        list.appendChild(div);
    });

    updateEntryUserSelect();
}

function addSwipeEvents(
    card,
    content,
    userId
) {
    card.addEventListener(
        "touchstart",
        function(event) {

            if (event.touches.length !== 1)
                return;

            swipeStartX =
                event.touches[0].clientX;

            swipeStartY =
                event.touches[0].clientY;

            swipeCurrentX =
                swipeStartX;

            activeSwipeElement =
                content;

            swipeMoved = false;

            content.style.transition =
                "none";
        },
        {
            passive: true
        }
    );

    card.addEventListener(
        "touchmove",
        function(event) {

            if (
                !activeSwipeElement ||
                event.touches.length !== 1
            )
                return;

            swipeCurrentX =
                event.touches[0].clientX;

            const currentY =
                event.touches[0].clientY;

            const deltaX =
                swipeCurrentX -
                swipeStartX;

            const deltaY =
                currentY -
                swipeStartY;

            if (
                Math.abs(deltaY) >
                Math.abs(deltaX)
            ) {
                return;
            }

            if (
                Math.abs(deltaX) > 10
            ) {
                swipeMoved = true;
            }

            const limitedDelta =
                Math.max(
                    -125,
                    Math.min(
                        125,
                        deltaX
                    )
                );

            content.style.transform =
                "translateX(" +
                limitedDelta +
                "px)";
        },
        {
            passive: true
        }
    );

    card.addEventListener(
        "touchend",
        function() {

            if (!activeSwipeElement)
                return;

            const deltaX =
                swipeCurrentX -
                swipeStartX;

            content.style.transition =
                "transform .25s ease";

            if (
                Math.abs(deltaX) >= 80
            ) {

                // NACH RECHTS = ZU SPÄT
                if (deltaX > 0) {

                    addSwipeEntry(
                        userId,
                        "Zu spät"
                    );

                // NACH LINKS = ABWESEND
                } else {

                    addSwipeEntry(
                        userId,
                        "Abwesend"
                    );
                }
            }

            content.style.transform =
                "translateX(0)";

            activeSwipeElement = null;

            setTimeout(
                function() {
                    swipeMoved = false;
                },
                50
            );
        },
        {
            passive: true
        }
    );

    card.addEventListener(
        "click",
        function(event) {

            if (swipeMoved) {
                event.preventDefault();
                event.stopPropagation();
            }
        },
        true
    );
}

function addSwipeEntry(
    userId,
    type
) {
    const today =
        new Date()
            .toISOString()
            .split("T")[0];

    const user =
        users.find(
            u => u.id === userId
        );

    if (!user) return;

    entries.unshift({
        id:
            Date.now() +
            Math.random(),

        userId:
            userId,

        type:
            type,

        date:
            today,

        note:
            "",

        created:
            new Date().toISOString()
    });

    saveData();

    renderAll();

    alert(
        user.name +
        ": " +
        (
            type === "Zu spät"
            ? "zu spät eingetragen."
            : "fehlt eingetragen."
        )
    );
}

function updateEntryUserSelect() {
    const select =
        document.getElementById(
            "entryUser"
        );

    const oldValue =
        select.value;

    select.innerHTML =
        '<option value="">Nutzer auswählen</option>';

    users.forEach(user => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            user.id;

        option.textContent =
            user.name +
            (
                user.number
                ? " (" +
                  user.number +
                  ")"
                : ""
            );

        select.appendChild(
            option
        );
    });

    if (
        users.some(
            u =>
                String(u.id) ===
                oldValue
        )
    ) {
        select.value =
            oldValue;
    }
}

function addEntry() {
    const userId =
        document.getElementById(
            "entryUser"
        ).value;

    const type =
        document.getElementById(
            "entryType"
        ).value;

    const date =
        document.getElementById(
            "entryDate"
        ).value;

    const note =
        document.getElementById(
            "entryNote"
        )
        .value
        .trim();

    if (!userId) {
        alert(
            "Bitte einen Nutzer auswählen."
        );
        return;
    }

    if (!date) {
        alert(
            "Bitte ein Datum auswählen."
        );
        return;
    }

    entries.unshift({
        id:
            Date.now() +
            Math.random(),

        userId:
            Number(userId),

        type:
            type,

        date:
            date,

        note:
            note,

        created:
            new Date().toISOString()
    });

    document.getElementById(
        "entryNote"
    ).value = "";

    saveData();
    renderAll();
}

function renderEntries() {
    const container =
        document.getElementById(
            "entries"
        );

    container.innerHTML = "";

    if (entries.length === 0) {
        container.innerHTML =
            '<div class="empty">' +
            'Noch keine Klassenbuch-Einträge vorhanden.' +
            '</div>';

        return;
    }

    entries.forEach(entry => {

        const user =
            users.find(
                u =>
                    u.id ===
                    entry.userId
            );

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "entry";

        div.innerHTML = `
            <strong>
                ${escapeHtml(
                    user
                    ? user.name
                    : "Gelöschter Nutzer"
                )}
            </strong>

            <br>

            <span>
                ${escapeHtml(entry.type)}
            </span>

            <br>

            <small>
                ${formatDate(entry.date)}
            </small>

            ${
                entry.note
                ? `<p>
                    ${escapeHtml(entry.note)}
                   </p>`
                : ""
            }

            <button
                class="danger"
                onclick="deleteEntry(${entry.id})">
                Eintrag löschen
            </button>
        `;

        container.appendChild(div);
    });
}

function deleteEntry(id) {
    if (
        !confirm(
            "Diesen Klassenbuch-Eintrag löschen?"
        )
    ) {
        return;
    }

    entries =
        entries.filter(
            entry =>
                entry.id !== id
        );

    saveData();
    renderAll();
}

function showUserEntries(id) {
    const user =
        users.find(
            u => u.id === id
        );

    if (!user) return;

    const userEntries =
        entries.filter(
            e =>
                e.userId === id
        );

    if (
        userEntries.length === 0
    ) {
        alert(
            "Für " +
            user.name +
            " gibt es noch keine Einträge."
        );

        return;
    }

    let text =
        "📖 Einträge von " +
        user.name +
        "\n\n";

    userEntries.forEach(
        entry => {

            text +=
                formatDate(
                    entry.date
                ) +
                " – " +
                entry.type;

            if (entry.note) {
                text +=
                    " – " +
                    entry.note;
            }

            text += "\n";
        }
    );

    alert(text);
}

function updateStats() {
    document.getElementById(
        "userCount"
    ).textContent =
        users.length;

    document.getElementById(
        "entryCount"
    ).textContent =
        entries.length;

    document.getElementById(
        "lateCount"
    ).textContent =
        entries.filter(
            e =>
                e.type === "Zu spät"
        ).length;

    document.getElementById(
        "absentCount"
    ).textContent =
        entries.filter(
            e =>
                e.type === "Abwesend"
        ).length;
}

function formatDate(date) {
    if (!date) return "";

    const parts =
        date.split("-");

    if (
        parts.length !== 3
    ) {
        return date;
    }

    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );
}

function escapeHtml(value) {
    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

function renderAll() {
    renderUsers();
    renderEntries();
    updateStats();
    updateEntryUserSelect();
}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadSettings();

        const today =
            new Date()
                .toISOString()
                .split("T")[0];

        document.getElementById(
            "entryDate"
        ).value = today;

        renderAll();
    }
);

</script>

</body>
